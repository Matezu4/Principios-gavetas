/* ===== regras ===== */
function cnts(){const c=Array(NB()).fill(0);Object.values(MV(0)).forEach(v=>{if(c[v]!==undefined)c[v]++});return c}
function pairSq(){const a=Object.values(MV(3)),q=p=>(p.x>.5?1:0)+(p.y>.5?2:0);
 for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++)if(q(a[i])==q(a[j]))return[a[i],a[j]];return null}
function result(){const p=st().phase,m=MV(p),k=Object.keys(m).length,n=st().n;
 if(p==4){const c=[0,0,0];Object.values(m).forEach(v=>c[v.c]++);return c.some(x=>x>1)?{ok:1,t:"Par formado! No pior caso saem 3 cores diferentes e a 4ª meia repete. Pombos: as meias. Gavetas: as 3 cores."}:null}
 if(p==0){if(k<n)return null;return cnts().every(x=>x>=1)?{ok:1,t:`Todas as ${NB()} caixas ocupadas com ${n} bolas: alguma caixa tem pelo menos ${Math.ceil(n/NB())}. Pombos: as bolas. Gavetas: as caixas.`}:{ok:0,t:"Ficou caixa vazia (e repetição antes da hora). Conversem e recomecem!"}}
 if(p==1){const c=[0,0,0,0];Object.values(m).forEach(v=>c[v.s]++);return c.some(x=>x>1)?{ok:1,t:"Cofre aberto! No pior caso saem 4 naipes diferentes e a 5ª carta repete. Pombos: cartas. Gavetas: naipes."}:null}
 if(p==2){if(k<n)return null;const L=Object.values(m).filter(v=>v==0).length+(n%2==0?1:0),T=n+(n%2==0?1:0);return{ok:1,t:`Impossível equilibrar: ${T} bolas em 2 pratos. Algum prato tem pelo menos ${Math.ceil(T/2)} (esq. ${L}, dir. ${T-L}).`}}
 const q=pairSq();if(q){const d=Math.hypot(q[0].x-q[1].x,q[0].y-q[1].y)*2;return{ok:1,t:`Dois pontos no mesmo quadradinho, a ${d.toFixed(2)} de distância (no máx. √2 ≈ 1,41). Pombos: pontos. Gavetas: 4 quadradinhos.`}}return null}

 if(p==2){const n=st().n,ex=n%2==0?1:0,L=E.filter(e=>e[1]==0).length+ex,R=E.filter(e=>e[1]==1).length,A=Math.max(-18,Math.min(18,(R-L)*5)),a=A*Math.PI/180;

  pan("pl",150-110*Math.cos(a),50-110*Math.sin(a),L,lc);pan("pr",150+110*Math.cos(a),50+110*Math.sin(a),R,rc)}
 if(p==3){let h='<svg viewBox="0 0 300 330" style="max-width:460px;margin:auto;transform:perspective(900px) rotateX(26deg);filter:drop-shadow(0 16px 10px #0005)"><rect y="20" width="300" height="300" fill="color-mix(in srgb,var(--ac) 8%,var(--card))" stroke="var(--tx)" stroke-width="3"/><path d="M150 20V320M0 170H300" stroke="var(--bd)" stroke-width="2"/>';

function fill(ids){const s=st(),p=s.phase;if(s.door=="o")return;const m=MV(p),k=Object.keys(m).length,c=cnts(),a=ids||Object.keys(PL()).filter(i=>m[i]===undefined);
 if(!ids)for(let i=a.length;i<s.n-k;i++)a.push("rs"+Date.now().toString(36)+i);
 a.forEach(id=>{if(m[id]!==undefined)return;let v;
  if(p==0){const f=c.map((x,i)=>x?-1:i).filter(i=>i>=0);v=f.length?f[Math.floor(Math.random()*f.length)]:Math.floor(Math.random()*NB());c[v]++}
  else if(p==1)v={s:Math.floor(Math.random()*4),r:RK[Math.floor(Math.random()*13)]};
  else if(p==2)v=Math.random()<.5?0:1;else if(p==3)v={x:Math.random(),y:Math.random()};else v={c:Math.floor(Math.random()*3)};

    if(p==4)a=done?`<div class="prob">Sua meia: ${SN[mv.c]}</div><div style="width:50px">${sockSvg(SOCK[mv.c])}</div>`:`<button class="b" onclick="send({c:Math.floor(Math.random()*3)})">🧦 Pegar meia no escuro</button>`;
    if(p==2){const L=Object.values(M).filter(v=>v==0).length,R=Object.values(M).filter(v=>v==1).length;a=`<div class="grid" style="grid-template-columns:1fr 1fr"><button class="b${mv===0?" on":""}" ${done?"disabled":""} onclick="send(0)">⬅ Esquerdo (${L})</button><button class="b${mv===1?" on":""}" ${done?"disabled":""} onclick="send(1)">Direito (${R}) ➡</button></div>`}
    if(p==3)a=`<svg viewBox="0 0 300 300" style="max-width:320px;margin:auto" onclick="pt(event)"><rect width="300" height="300" fill="var(--card)" stroke="var(--tx)" stroke-width="3"/><path d="M150 0V300M0 150H300" stroke="var(--bd)" stroke-width="2"/>${Object.entries(M).map(([g,v])=>`<circle cx="${v.x*300}" cy="${v.y*300}" r="9" fill="${gcp(g)}"/>`).join("")}</svg>`;
    a+=done?'<p class="mut">✔ Enviado! Agora ajudem seu grupo e a turma.</p>':`<p class="mut">${P[p].h}</p>`}
   h=`<div class="card">${top}<span class="tag">${P[p].t}</span><div class="prob">${P[p].p()}</div>${a}<p class="mut">Seu grupo: ${mates||"—"}</p></div>`}}
 if(h!==last){const ae=document.activeElement;if(ae&&ae.tagName=="INPUT"&&$("app").contains(ae)&&(!me.gid||editing))return;$("app").innerHTML=h;last=h}}

function render(){if(role=="host")hostRender();else{if(FIREBASE_CONFIG&&!tree.host){last="";$("hb").innerHTML="";$("app").innerHTML='<div class="card"><div class="prob">Sala não aberta</div><p>O apresentador ainda não abriu esta sala, ou ela foi encerrada. Peça o QR atualizado. Esta tela entra sozinha quando a sala abrir.</p></div>';return}if(me.gid&&!PL()[me.pid]&&Date.now()-lastRj>3000){lastRj=Date.now();rejoin()}partRender()}}
function bar(){if(FIREBASE_CONFIG){$("bar").innerHTML="";return}
 $("bar").innerHTML=`<div class="tabs"><button class="b ${role=="host"?"":"g"}" onclick="role='host';last='';hostReady=false;render();bar()">📽️ Apresentador</button><button class="b ${role=="part"?"":"g"}" onclick="role='part';last='';render();bar()">📱 Participante</button></div><p class="mut">Modo demonstração (sem Firebase). Abas do mesmo navegador sincronizam entre si.</p>`}
bar();FIREBASE_CONFIG?fbDB():localDB();
</script></body></html>
